default_install_hook_types:
  - pre-commit
  - pre-push
default_stages:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: detect-secrets
        name: detect secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^(?:uv\.lock|config/schema/)
      - id: config-schema
        name: configuration schema integrity
        entry: uv run python scripts/generate_config_schema.py --check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: strict-types
        name: mypy strict
        entry: uv run mypy --strict src
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: tests
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: verify-release
        name: release verification
        entry: uv run python scripts/verify_release.py
        language: system
        pass_filenames: false
        stages: [pre-push]

